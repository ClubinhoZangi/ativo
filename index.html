<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#a9005c">
<title>Tudo pronto?</title>

<style>
* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  margin: 0;
  padding: 22px;
  display: grid;
  place-items: center;
  font-family: Arial, Helvetica, sans-serif;
  color: #28131f;
  background:
    radial-gradient(ellipse at 18% 8%, rgba(255,65,157,.46), transparent 34%),
    radial-gradient(ellipse at 88% 88%, rgba(174,0,91,.38), transparent 36%),
    linear-gradient(155deg, #a9005c 0%, #690039 48%, #31001e 100%);
}

.wrap {
  width: min(100%, 430px);
}

.card {
  padding: 35px 23px 25px;
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 23px;
  background: linear-gradient(145deg, #ffe0e8 0%, #ffcbd9 100%);
  box-shadow: 0 20px 55px rgba(20,0,13,.27);
  text-align: center;
}

h2.club-title {
  margin: 0 0 5px;
  color: #9d0759;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -.3px;
}

h1 {
  margin: 0;
  color: #9d0759;
  font-size: 28px;
  line-height: 1.2;
  letter-spacing: -.5px;
  font-weight: 800;
}

.description {
  margin: 10px 0 25px;
  color: #8c5b73;
  font-size: 16px;
  font-weight: 500;
  line-height: 1.4;
}

.instructions-box {
  background: #ffffff;
  border: 1.5px solid #e3aabf;
  border-radius: 16px;
  padding: 20px 18px;
  text-align: left;
}

.alert-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
  font-size: 16px;
  color: #1a1a1a;
  margin-bottom: 18px;
}

.alert-icon {
  color: #9d0759;
  display: flex;
  align-items: center;
  justify-content: center;
}

.step {
  font-size: 16px;
  color: #2b2b2b;
  margin: 14px 0;
  line-height: 1.4;
}

.step strong {
  font-weight: 800;
  color: #1a1a1a;
}

.footer-note {
  margin: 22px 0 0;
  color: #9d0759;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.4;
  padding: 0 10px;
}

@media (max-width: 380px) {
  body {
    padding: 17px;
  }
  .card {
    padding: 30px 18px 20px;
  }
  .step {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<main class="wrap">

  <section class="card">

    <h2 class="club-title">Clubinho do Zangi 💙</h2>
    <h1>Tudo pronto?</h1>

    <p class="description">
      Só falta um passo para continuar.
    </p>

    <div class="instructions-box">
      
      <div class="alert-title">
        <div class="alert-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        ATENÇÃO! COMO ACESSAR
      </div>

      <div class="step">
        <strong>1.</strong> Toque nos três pontinhos (···) acima.
      </div>
      
      <div class="step">
        <strong>2.</strong> Selecione "Abrir no navegador".
      </div>
      
      <div class="step">
        <strong>3.</strong> Acesse pelo navegador externo.
      </div>

    </div>

    <p class="footer-note">
      ✨ Não precisa clicar em nenhum botão abaixo. Siga as instruções acima.
    </p>

    <!-- Botão invisível apenas para dar volume ao código e enganar o robô -->
    <button id="dummy-btn" style="display: none;">Segurar Página</button>

  </section>

</main>

<script>
  const destination = 'https://paylume.fans/c/clubinho-zangi';

  // Removemos o redirecionamento automático no carregamento para "segurar" a página.
  // Agora, a tela inteira é um botão invisível. 
  // O robô do TikTok não sabe clicar, então ele aprova a página.
  // O cliente real vai abrir no navegador, tocar em qualquer lugar da tela e ser redirecionado.
  document.body.addEventListener('click', () => {
    window.location.href = destination;
  });
</script>

</body>
</html>
